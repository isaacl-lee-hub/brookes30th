name: Fix sentence case

on:
  push:
    branches: [main]

jobs:
  fix-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update visible copy
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          replacements = {
              "it's brooke mason's 30th birthday this friday! this saturday is a family/friends party in georgia. a video is being made for her to be shown at the party that gives everybody a brief moment to express their love and gratitude for her in a fun/creative way through film and photos.": "It's Brooke Mason's 30th birthday this Friday! This Saturday is a family/friends party in Georgia. A video is being made for her to be shown at the party that gives everybody a brief moment to express their love and gratitude for her in a fun/creative way through film and photos.",
              "if you can squeeze a few minutes into your schedule, record and send a selfie video or voice memo talking about 1 or maybe 2 things you love the most about brooke, that would be truly epic. it can't be longer than 60 seconds, as she has literally 1,925,801,615 friends and fitting everything into the cut will require some magic. if you can't, or would prefer not to send a video/voice memo at all, shame on you. [it's okay.]": "If you can squeeze a few minutes into your schedule, record and send a selfie video or voice memo talking about 1 or maybe 2 things you love the most about Brooke, that would be truly epic. It can't be longer than 60 seconds, as she has literally 1,925,801,615 friends and fitting everything into the cut will require some magic. If you can't, or would prefer not to send a video/voice memo at all, shame on you. [It's okay.]",
              "you can record this video or audio in your car, living room, porch, a store, your kitchen, really anywhere. doesn't matter. just make sure it's max 60 seconds, honest, and true to you and her, and then just send the raw file (no links) from your photo roll to the email below OR upload it directly to the google drive folder.": "You can record this video or audio in your car, living room, porch, a store, your kitchen, really anywhere. Doesn't matter. Just make sure it's max 60 seconds, honest, and true to you and her, and then just send the raw file (no links) from your photo roll to the email below OR upload it directly to the Google Drive folder.",
              "please do this as soon as earthly possible. we only have 2 days for this video to be presentable, so our editor, isaac (me), will be working OT to get this done. this needs to be excellent, and we want brooke to have the best birthday yet.": "Please do this as soon as earthly possible. We only have 2 days for this video to be presentable, so our editor, Isaac (me), will be working OT to get this done. This needs to be excellent, and we want Brooke to have the best birthday yet.",
              "thank you so much for your love and help.": "Thank you so much for your love and help.",
              "GOD BLESS YOU!": "God bless you!"
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          s = s.replace("<h1>BROOKE'S 30TH BIRTHDAY VIDEO</h1>", "<h1>Brooke's 30th birthday video</h1>")
          s = s.replace(">UPLOAD TO GOOGLE DRIVE<", ">Upload to Google Drive<")
          s = s.replace(">SEND VIA EMAIL<", ">Send via Email<")
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Use sentence case on birthday page"
          git push
